# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=5.1.1
group=net.trique.mythicupgrades
java_version=25
license=MIT
credits=

# Common
minecraft_version=26.3
mod_name=Mythic Upgrades
mod_author=trique
mod_id=mythicupgrades
description=Mythic Upgrades adds new mythic crystals & gems to the game!
minecraft_version_range=[26.3, 26.4)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.161.0+26.3
fabric_loader_version=0.19.5
cloth_config_version=26.3.159
modmenu_version=21.0.0

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.26-beta
neoforge_loader_version_range=[4,)

# Dev-runtime only (compatibility testing), not a mod dependency
terrablender_version=26.3-26.3.0.0.7

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
